name: Publish global benchmark report

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REA_BENCHMARK_OFFLINE: "1"
    steps:
      - name: Checkout public source and sanitized summary cache
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check privacy boundary, cached metrics, links and reproducibility
        run: make check-public
      - name: Regenerate HTML-only report from the summary cache
        run: make reports-public
      - name: Upload only the checked public site
        uses: actions/upload-pages-artifact@v4
        with:
          path: benchmarks/site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy checked public artifact
        id: deployment
        uses: actions/deploy-pages@v4
